*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{color:var(--ink);font-family:Cinzel,Georgia,"Times New Roman",serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.screen{height:100%;display:none}
.screen.on{display:flex}
#setup{flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:26px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,rgba(15,18,38,.3),rgba(15,18,38,.7))}
h1{margin:0;font-size:2.6rem;letter-spacing:.04em;font-weight:700;line-height:1}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:60px;height:60px}
.sub{font-size:1rem;color:var(--mute);letter-spacing:.12em}
#home{flex-direction:column;align-items:center;justify-content:safe center;gap:22px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,rgba(15,18,38,.3),rgba(15,18,38,.7))}
#home .logo svg{width:78px;height:78px}
#home h1{font-size:3.3rem}
#home .fmt{flex-direction:column;gap:14px}
#home .fmt button{padding:18px 12px;font-size:1.5rem;border-radius:20px}
#home .fmt button small{font-size:.9rem;margin-top:4px}
.setbody{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.topbar{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar button{background:#1b1f45;border:2px solid #343a7a;border-radius:999px;padding:8px 16px;font-size:.95rem}
#fmtlabel{color:var(--gold);font-size:.9rem}
h2{margin:0 0 10px;font-size:1rem;font-weight:500;color:var(--mute)}
.fmt{display:flex;gap:10px;width:min(320px,100%)}
.fmt button{flex:1;padding:10px 8px;border-radius:16px;background:#1b1f45;border:2px solid #343a7a;font-weight:700;font-size:1.1rem;line-height:1.35}
.fmt button small{display:block;font-weight:500;font-size:.78rem;color:var(--mute)}
.fmt button.on{background:var(--gold);color:#1a1530;border-color:var(--gold)}
.fmt button.on small{color:#3a3050}
.c3 .p .nm img{height:30px}
.seg{display:flex;gap:10px;justify-content:center}
.seg button{width:56px;height:56px;border-radius:50%;background:#1b1f45;font-size:1.7rem;font-weight:700;border:2px solid #343a7a}
.seg button.on{background:var(--gold);color:#1a1530;border-color:var(--gold)}
.names{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.prow{display:flex;flex-direction:column;gap:8px}
.pline{display:flex;gap:8px}
.inkbtn{flex:0 0 auto;height:54px;border-radius:12px;display:flex;align-items:center;gap:2px;padding:0 6px!important;background:#1b1f45;border:2px solid #343a7a;padding:0}
.inkbtn.on{border-color:var(--gold)}
.inkbtn img{height:40px;width:auto}
.picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px;background:#161a3b;border-radius:12px}
.pk{width:42px;height:46px;border-radius:10px;display:grid;place-items:center;background:#1b1f45;padding:0;opacity:.75}
.pk img{height:38px;width:auto}
.pk{position:relative}
.pk.sel{opacity:1;outline:2px solid var(--gold)}
.pk[data-n]::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1530;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.hint{flex:1 0 100%;text-align:center;font-size:.85rem;color:var(--mute)}
.p .nm img{height:34px;width:auto;flex:none}
.p .nm{gap:4px}
.names input{flex:1;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:2px solid #343a7a;border-left-width:8px;background:#1b1f45;color:var(--ink);font:inherit;font-size:1.05rem;text-align:center;user-select:text;-webkit-user-select:text}
.names input:focus{outline:2px solid var(--gold);outline-offset:2px}
.draw{width:96px;height:96px;border-radius:50%;background:#1b1f45;border:2px solid var(--gold);display:grid;place-items:center}
.draw:active{transform:scale(.94)}
.draw svg{width:46px;height:46px}
#res{min-height:1.5em;font-size:1.3rem;color:var(--gold);max-width:260px}
.go{padding:16px 38px;border-radius:999px;background:var(--gold);color:#1a1530;font-size:1.2rem;font-weight:700}
#game{position:relative;display:none;padding:4px;gap:8px}
#game.on{display:grid}
#game.g2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
#game.g3,#game.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#game.g3 .p:nth-child(3){grid-column:1 / 3}
.p{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:22px;min-height:0;border:3px solid transparent;overflow:hidden}
.p.flip{transform:rotate(180deg)}
.p{transition:box-shadow .08s,filter .08s}
.p.hl{filter:brightness(1.5);box-shadow:0 0 0 4px #fff,0 0 30px #fff8!important}
#ov{position:absolute;inset:0;z-index:20;background:rgba(15,18,38,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px}
#ov.off{display:none}
.skip{background:none;color:var(--mute);text-decoration:underline;font-size:.95rem}
.p .nm{font-size:1.2rem;font-weight:500;color:rgba(255,255,255,.85);display:flex;gap:8px;align-items:center}
.p .first{font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--gold);color:#1a1530;font-weight:700}
.p .num{font-size:clamp(64px,calc(22*var(--vw)),120px);font-weight:700;line-height:1;color:#fff}
.g3 .num,.g4 .num{font-size:clamp(56px,calc(20*var(--vw)),92px)}
.p .win{height:1.2em;font-size:.9rem;color:var(--gold);font-weight:700}
.row{display:flex;gap:16px}
.row button{width:64px;height:64px;border-radius:50%;font-size:2.2rem;line-height:1;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.row{pointer-events:none}
.row button.act{background:rgba(255,255,255,.4);transform:scale(.92)}
.p{cursor:pointer;-webkit-touch-callout:none}
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;min-width:46px;height:46px;padding:0 12px;border-radius:99px;background:#0f1226;border:2px solid var(--gold);font-size:.8rem;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.p{transition:none}}
#win{position:absolute;inset:0;z-index:30;background:rgba(10,12,30,.82);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
#win.off{display:none}
#fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.wbox.flip{transform:rotate(180deg)}
.wname{font-size:clamp(2rem,calc(10*var(--vw)),4.6rem);font-weight:700;line-height:1.05;color:#fff;text-shadow:0 0 24px var(--gold);overflow-wrap:anywhere}
.wsub{color:var(--gold);font-size:1.2rem}
.wlogos{display:flex;gap:6px}
.wlogos img{height:46px;width:auto}
.wbtns{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
#home{overflow-y:auto}


.rules{display:none;flex-direction:column;gap:10px;width:min(320px,100%)}
.rules.on{display:flex}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#161a3b;border-radius:14px;padding:8px 10px}
.sl{font-size:.9rem;text-align:left;flex:1}
.sc{display:flex;align-items:center;gap:6px}
.sc button{width:38px;height:38px;border-radius:50%;background:#1b1f45;border:2px solid #343a7a;font-size:1.3rem;font-weight:700;padding:0}
.sc input,.sc .sv{width:52px;text-align:center;font:inherit;font-size:1.2rem;font-weight:700;color:var(--gold);background:transparent;border:0;padding:0;user-select:text;-webkit-user-select:text}
.sc input{border-bottom:2px solid #343a7a;-moz-appearance:textfield;border-radius:0}
.sc input::-webkit-outer-spin-button,.sc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inkbtn.many img{height:26px}
.p .nm{flex-wrap:wrap;justify-content:center}
.c6 .p .nm img{height:20px}
.wlogos{flex-wrap:wrap;justify-content:center}


#game.g5,#game.g6{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
#game.g5 .p:nth-child(5){grid-column:1 / 3}
.g5 .p,.g6 .p{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"nm nm nm" "m num pl" "w w w";align-items:center;justify-items:center;gap:0 4px;padding:2px 6px}
.g5 .p .nm,.g6 .p .nm{grid-area:nm;font-size:1rem}
.g5 .p .nm img,.g6 .p .nm img{height:26px}
.g5 .p .num,.g6 .p .num{grid-area:num;font-size:clamp(36px,calc(8*var(--vh)),58px)}
.g5 .p .win,.g6 .p .win{grid-area:w;height:1em;font-size:.7rem}
.g5 .row,.g6 .row{display:contents}
.g5 .row button,.g6 .row button{width:38px;height:38px;font-size:1.4rem}
.g5 .row button:first-child,.g6 .row button:first-child{grid-area:m}
.g5 .row button:last-child,.g6 .row button:last-child{grid-area:pl}
.c6 .p .nm img{height:20px}

#game.g5 #menu,#game.g6 #menu{top:3px;transform:translateX(-50%);min-width:0;height:26px;padding:0 10px;font-size:.7rem;border-width:1px}

.imgrow{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--mute);text-align:left}
.imgrow span{flex:1}
.imgbtn{flex:0 0 36px;height:36px;border-radius:9px;background:#1b1f45 center/cover no-repeat;border:2px solid #343a7a;font-size:1.3rem;font-weight:700;padding:0;color:var(--gold)}
.imgrm{background:none;color:var(--mute);text-decoration:underline;font-size:.8rem;padding:0}
.imgpick{align-items:center}
.gal{height:46px;padding:0 14px;border-radius:10px;background:var(--gold);color:#1a1530;font-weight:700;font-size:.9rem;display:grid;place-items:center;cursor:pointer}
.pi{width:64px;height:46px;border-radius:10px;border:2px solid #343a7a;background:#1b1f45 center/cover no-repeat;padding:0}
.p .num,.p .nm{text-shadow:0 2px 10px rgba(0,0,0,.65)}
.p.hasimg::before{content:'';position:absolute;left:0;right:0;top:0;height:55%;opacity:.5;background:var(--img) center/cover no-repeat;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);z-index:0;pointer-events:none}
.p.hasimg>*{position:relative;z-index:1}
.p.hasimg[data-ipos="bottom"]::before{top:auto;bottom:0;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.p.hasimg[data-ipos="left"]::before{top:0;bottom:0;left:0;right:auto;width:55%;height:auto;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.p.hasimg[data-ipos="right"]::before{top:0;bottom:0;left:auto;right:0;width:55%;height:auto;-webkit-mask-image:linear-gradient(270deg,#000 55%,transparent);mask-image:linear-gradient(270deg,#000 55%,transparent)}

/* mise en page horizontale (classe .land, appliquée par le script) */
#game.land .p{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"nm nm nm" "m num pl" "w w w";align-items:center;justify-items:center;gap:0 6px;padding:2px 10px}
#game.land .p .nm{grid-area:nm;font-size:1rem}
#game.land .p .nm img,#game.land.c3 .p .nm img{height:26px}
#game.land .p .num,#game.land.g3 .num,#game.land.g4 .num{grid-area:num;font-size:clamp(40px,calc(17*var(--vh)),72px)}
#game.land .p .win{grid-area:w;height:1em;font-size:.7rem}
#game.land .row{display:contents}
#game.land .row button{width:44px;height:44px;font-size:1.6rem}
#game.land .row button:first-child{grid-area:m}
#game.land .row button:last-child{grid-area:pl}
#game.land #ov{gap:8px;padding:8px}
#game.land .draw{width:64px;height:64px}
#game.land .draw svg{width:34px;height:34px}
#game.land #win{padding:6px}
#game.land .wbox{gap:6px}
#game.land .wname{font-size:clamp(1.8rem,calc(11*var(--vh)),3.4rem)}
#game.land .wlogos img{height:30px}
#game.land .wbtns{flex-direction:row;gap:16px;margin-top:2px}
#game.land.c6 .p .nm img{height:18px}
#game.land.g5,#game.land.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
#game.land.g5 .p:nth-child(5){grid-column:span 2}
#game.land .p.flipL{transform:rotate(180deg)}
#game.land.g5 .p .num,#game.land.g6 .p .num{font-size:clamp(40px,calc(15*var(--vh)),64px)}
#game.land.g5 .row button,#game.land.g6 .row button{width:44px;height:44px;font-size:1.6rem}
#game.land.c6 .p .nm img{height:18px}
@media (orientation:landscape) and (max-height:600px){
#home{justify-content:safe center;gap:14px;padding:10px}

#home .fmt{flex-direction:row;width:min(560px,100%)}
#home .fmt button{padding:10px}

.hlist{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}

.p{touch-action:none}

.finks{display:flex;gap:6px;justify-content:center}

const $=id=>document.getElementById(id);
const nm=i=>(names[i]||'').trim()||('Joueur '+(i+1));

const nI=()=>fmt==='coconut'?3:fmt==='custom'?cInks:2;
const goal=()=>fmt==='coconut'?25:fmt==='custom'?cGoal:20;
function fmtText(){
  if(fmt==='coconut') return 'Coconut · 25 points · 3 encres';
  if(fmt==='custom') return 'Personnalisé · '+cGoal+' points · '+cInks+(cInks>1?' encres':' encre');
  return 'Classique · 20 points · 2 encres';
}
function stepRow(label,get,set,min,max,typed){
  const row=document.createElement('div'); row.className='step';
  const l=document.createElement('div'); l.className='sl'; l.textContent=label;
  const c=document.createElement('div'); c.className='sc';
  const dn=document.createElement('button'); dn.textContent='−'; dn.setAttribute('aria-label','Diminuer : '+label);
  const up=document.createElement('button'); up.textContent='+'; up.setAttribute('aria-label','Augmenter : '+label);
  let v;
  if(typed){
    v=document.createElement('input'); v.type='number'; v.inputMode='numeric'; v.min=min; v.max=max; v.value=get();
    v.setAttribute('aria-label',label);
    v.oninput=()=>{ const n=parseInt(v.value,10); if(!isNaN(n)) set(Math.min(max,Math.max(min,n))); };
    v.onchange=()=>{ v.value=get(); };
  } else { v=document.createElement('span'); v.className='sv'; v.textContent=get(); }
  dn.onclick=()=>{ set(Math.max(min,get()-1)); if(typed) v.value=get(); };
  up.onclick=()=>{ set(Math.min(max,get()+1)); if(typed) v.value=get(); };
  c.append(dn,v,up); row.append(l,c);
  return row;
}
function renderRules(){
  const r=$('rules'); r.innerHTML=''; r.classList.toggle('on',fmt==='custom');
  if(fmt!=='custom') return;
  const fl=()=>{ $('fmtlabel').textContent=fmtText(); save(); };
  r.appendChild(stepRow('Points pour gagner',()=>cGoal,n=>{ cGoal=n; fl(); },1,99,true));
  r.appendChild(stepRow('Encres par deck',()=>cInks,n=>{ cInks=n; setFormat('custom'); },1,6,false));
  r.appendChild(stepRow('Lore de départ',()=>cStart,n=>{ cStart=n; save(); },0,98,true));
}
const inks=i=>ink[i].slice(0,nI());
function setFormat(f){
  fmt=f; openPick=-1; openImg=-1; pending=[];
  if(fmt!=='custom'&&count>4) count=4;
  for(let i=0;i<6;i++){
    const a=ink[i].slice(0,nI());
    for(let k=0;a.length<nI();k++){ if(!a.includes(k)) a.push(k); }
    ink[i]=a;
  }
  renderSetup();
}
function renderSetup(){
  save();
  $('fmt').innerHTML='';
  [['classic','Classique','20 points · 2 encres'],['coconut','Coconut','25 points · 3 encres'],['custom','Personnalisé','Tu choisis les règles']].forEach(([f,t,sub])=>{
    const b=document.createElement('button'); b.className=fmt===f?'on':'';
    b.innerHTML=t+'<small>'+sub+'</small>';
    b.onclick=()=>{ setFormat(f); show('setup'); };
    $('fmt').appendChild(b);
  });
  $('fmtlabel').textContent=fmtText(); renderRules();
  $('seg').innerHTML='';
  (fmt==='custom'?[2,3,4,5,6]:[2,3,4]).forEach(n=>{
    const b=document.createElement('button');
    b.textContent=n; b.className=n===count?'on':'';
    b.setAttribute('aria-label',n+' joueurs');
    b.onclick=()=>{ count=n; openPick=-1; renderSetup(); };
    $('seg').appendChild(b);
  });
  $('names').innerHTML='';
  for(let i=0;i<count;i++){
    const wrap=document.createElement('div'); wrap.className='prow';
    const line=document.createElement('div'); line.className='pline';
    const ib=document.createElement('button'); ib.className='inkbtn'+(openPick===i?' on':'');
    ib.innerHTML=inks(i).map(k=>inkSvg(k)).join(''); ib.classList.toggle('many',nI()>3);
    ib.setAttribute('aria-label','Encres du joueur '+(i+1)+' : '+inks(i).map(k=>COL[k].n).join(', ')+'. Changer');
    ib.onclick=()=>{ pending=[]; openImg=-1; openPick=openPick===i?-1:i; renderSetup(); };
    line.appendChild(ib);
    const inp=document.createElement('input');
    inp.type='text'; inp.maxLength=14; inp.value=names[i];
    inp.placeholder='Joueur '+(i+1);
    inp.style.borderLeftColor=COL[ink[i][0]].c;
    inp.setAttribute('aria-label','Nom du joueur '+(i+1));
    inp.oninput=()=>{ names[i]=inp.value; save(); };
    line.appendChild(inp); wrap.appendChild(line);
    if(openPick===i){
      const pk=document.createElement('div'); pk.className='picker';
      const h=document.createElement('div'); h.className='hint';
      h.textContent=pending.length?'Choisis la '+(pending.length+1)+'e encre':'Choisis les '+nI()+' encres du deck';
      pk.appendChild(h);
      COL.forEach((c,k)=>{

  $('wname').textContent=nm(i);
  $('wlogos').innerHTML=inks(i).map(k=>inkSvg(k)).join('');
  $('wbox').classList.toggle('flip',isFlip($('p'+i)));
  $('wbox').style.transform=$('p'+i).dataset.rot?'rotate('+$('p'+i).dataset.rot+'deg)':'';
  $('win').classList.remove('off');
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches) startFW(inks(i).map(k=>COL[k].c).concat('#e0b25a','#ffffff'));
}
const startLore=()=>fmt==='custom'?Math.min(cStart,cGoal-1):0;
function rematch(){
  closeWin();
  lore=lore.map(()=>startLore()); won=-1; starter=null;
  document.querySelectorAll('.first').forEach(e=>e.remove());
  lore.forEach((_,i)=>upd(i));
  light(-1);
  $('res').textContent=''; $('ok').style.display='none';
  $('ov').classList.remove('off');
}
function closeWin(){ $('win').classList.add('off'); if(fw){ fw(); fw=null; } }
function localX(p,e){
  const r=p.getBoundingClientRect(), rot=p.dataset.rot;
  if(rot==='90') return {x:e.clientY-r.top, w:r.height};
  if(rot==='-90') return {x:r.bottom-e.clientY, w:r.height};
  let x=e.clientX-r.left; if(isFlip(p)) x=r.width-x;
  return {x, w:r.width};
}
function layoutSides(){
  if(!$('game').classList.contains('on')||!$('p0')) return;
  const land=$('game').classList.contains('land');
  [2,3].forEach(i=>{
    const p=$('p'+i); if(!p) return;
    if(count<5||land){
      ['width','height','transform','alignSelf','justifySelf'].forEach(k=>{ p.style[k]=''; });
      delete p.dataset.rot; return;
    }
    const w=$('p0').offsetWidth, h=$('p0').offsetHeight, rot=i===2?90:-90;
    p.style.width=h+'px'; p.style.height=w+'px';
    p.style.alignSelf='start'; p.style.justifySelf='start';
    p.style.transform='translate('+((w-h)/2)+'px,'+((h-w)/2)+'px) rotate('+rot+'deg)';
    p.dataset.rot=rot;
  });
}
function renderIpos(){
  const box=$('ipos'); box.innerHTML='';
  const cur=ori==='h'?'h':'v';
  const opts=cur==='h'?[['left','Gauche'],['top','Haut'],['right','Droite']]:[['top','Haut'],['bottom','Bas']];
  const lab=document.createElement('div'); lab.className='hint'; lab.textContent='Image de fond';
  box.appendChild(lab);
  opts.forEach(([k,t])=>{
    const b=document.createElement('button'); b.className=imgPos[cur]===k?'on':''; b.textContent=t;
    b.onclick=()=>{ imgPos[cur]=k; renderIpos(); applyImgPos(); save(); };
    box.appendChild(b);
  });
}
function applyImgPos(){
  const cur=$('game').classList.contains('land')?'h':'v';
  const pos=imgPos[cur];
  document.querySelectorAll('.p.hasimg').forEach(p=>{ p.dataset.ipos=pos; });
}
function renderOri(){
  $('ori').innerHTML='';
  [['v','Vertical','Portrait'],['h','Horizontal','Paysage']].forEach(([k,t,sub])=>{
    const b=document.createElement('button'); b.className=ori===k?'on':'';
    b.innerHTML=t+'<small>'+sub+'</small>';
    b.onclick=()=>{ ori=k; renderOri(); applyOri(); layoutSides(); applyImgPos(); };
    $('ori').appendChild(b);
  });
}
function applyOri(){
  const g=$('game'), W=window.innerWidth, H=window.innerHeight, devLand=W>H;
  const wantLand=ori==='h'?true:ori==='v'?false:(devLand&&H<=600);
  const rot=ori!=='auto'&&wantLand!==devLand; rotated=rot;
  g.classList.toggle('land',wantLand);
  const st=g.style;
  ['position','left','top','width','height','transformOrigin','transform','zIndex'].forEach(k=>{ st[k]=''; });
  if(rot){
    st.position='fixed'; st.left='0'; st.top='0'; st.zIndex='5';
    st.width=H+'px'; st.height=W+'px';
    st.transformOrigin='0 0'; st.transform='translateX('+W+'px) rotate(90deg)';
  }
  const ew=rot?H:W, eh=rot?W:H;
  document.documentElement.style.setProperty('--vw',(ew/100)+'px');
  document.documentElement.style.setProperty('--vh',(eh/100)+'px');
}
function loadImg(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,640/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.8));
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function isFlip(p){ return p.classList.contains('flip')||(p.classList.contains('flipL')&&$('game').classList.contains('land')); }
function upd(i){
  $('n'+i).textContent=lore[i];
  if(lore[i]>=goal()&&won<0) win(i);
  $('w'+i).textContent=lore[i]>=goal()?goal()+' de lore atteints !':'';
  $('p'+i).style.boxShadow=lore[i]>=goal()?'0 0 0 3px #e0b25a, 0 0 26px #e0b25a88':'none';
}
function show(id){ ['home','setup','hist'].forEach(k=>$(k).classList.toggle('on',k===id)); }
$('back').onclick=()=>show('home');
$('histBtn').onclick=()=>{ hmore=10; renderHist(); show('hist'); };
$('hback').onclick=()=>show('home');
$('hmore').onclick=()=>{ hmore+=10; renderHist(); };
$('hclear').onclick=()=>{ if(confirm('Effacer tout l’historique ?')){ store.set('encrier:hist',[]); renderHist(); } };
new ResizeObserver(()=>layoutSides()).observe($('game'));
addEventListener('resize',()=>{ if($('game').classList.contains('on')){ applyOri(); layoutSides(); } });
load();
renderSetup();
</script>
